{% include base_path %}

<!-- start custom head snippets -->

<!-- Inter font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- favicon: "AE" monogram in LBS navy/red -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
/* Profile hero */
.profile-hero {
  display: flex;
  align-items: flex-start;
  gap: 2rem;
  padding: 1.75rem 1.5rem;
  max-width: 840px;
  margin: 0 auto;
  border-bottom: 1px solid #e2e8f0;
}
.profile-hero__photo img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 2px;
  flex-shrink: 0;
  display: block;
}
.profile-hero__info { flex: 1; padding-top: 0.25rem; }
.profile-hero__name {
  font-size: 2.1rem;
  font-weight: 400;
  color: var(--global-base-color);
  margin: 0 0 0.4rem;
  line-height: 1.1;
}
.profile-hero__role { font-size: 0.95rem; color: #444; margin: 0 0 1rem; }
.profile-hero__links { display: flex; gap: 1.1rem; flex-wrap: wrap; }
.profile-link {
  display: inline-block;
  color: var(--global-base-color);
  text-decoration: underline;
  text-underline-offset: 0.15em;
  font-size: 0.9rem;
}
.profile-link:hover { color: var(--global-link-color-hover); }

/* Draft status stays secondary to the paper title. */
.paper-status {
  display: inline-block;
  color: #555;
  font-style: italic;
  font-size: 0.9rem;
}

/* Section headings use typographic hierarchy without decorative accents. */
.page__content h2 {
  color: var(--global-base-color);
  margin-bottom: 0.8rem;
}

/* Full-width layout — override Susy grid when sidebar is absent */
#main .page,
#main .archive,
.page--fullwidth {
  float: none !important;
  width: 100% !important;
  max-width: 840px;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: 1.5rem;
  padding-right: 1.5rem;
  -webkit-margin-before: 0;
}

.page--fullwidth {
  padding-top: 1.75rem;
  padding-bottom: 1rem;
}

/* Divider under the page title on inner pages */
.page-divider {
  margin: 0.25rem 0 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--global-border-color);
}

/* Responsive */
@media (max-width: 600px) {
  .profile-hero {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 1.75rem 1.5rem;
    gap: 1.5rem;
  }
  .profile-hero__photo img { width: 150px; height: 150px; }
  .profile-hero__links { justify-content: center; }
  .education-item { flex-direction: column; gap: 0.15rem; }
  #main .page, #main .archive, .page--fullwidth {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}
</style>

<!-- end custom head snippets -->
