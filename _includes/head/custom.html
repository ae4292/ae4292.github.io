{% include base_path %}

<!-- start custom head snippets -->

<!-- Inter font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- favicon: "AE" monogram in LBS navy/red -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>



<style>
/* Profile hero */
.profile-hero {
  display: flex;
  align-items: flex-start;
  gap: 2rem;
  padding: 1.75rem 1.5rem;
  max-width: 840px;
  margin: 0 auto;
  border-bottom: 1px solid #e2e8f0;
}
.profile-hero__photo img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  object-position: center 25%;
  border-radius: 2px;
  flex-shrink: 0;
  display: block;
}
.profile-hero__info { flex: 1; padding-top: 0.25rem; }
.profile-hero__name {
  font-size: 2.1rem;
  font-weight: 400;
  color: var(--global-base-color);
  margin: 0 0 0.4rem;
  line-height: 1.1;
}
.profile-hero__role { font-size: 0.95rem; color: #444; margin: 0 0 1rem; }
.profile-hero__links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.profile-link {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.8rem;
  color: var(--global-base-color);
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  text-decoration: none;
  font-size: 0.85rem;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.profile-link:hover { background: var(--global-base-color); border-color: var(--global-base-color); color: #fff; }
.profile-hero__tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0 0 1rem; }
.tag-chip {
  padding: 0.15rem 0.6rem;
  background: #eef2f7;
  color: #334155;
  border-radius: 4px;
  font-size: 0.78rem;
  letter-spacing: 0.01em;
}

/* Abstract embedding-style scatter background (static SVG, no JavaScript).
   Decorative: generated dots in the site's navy, with a few red "jump" points linked
   to their nearest neighbours. Not real data. */
body {
  background:
    radial-gradient(ellipse 55% 80% at 50% 45%, rgba(255, 255, 255, 0.95) 55%, rgba(255, 255, 255, 0.12) 100%),
    url("{{ site.baseurl }}/images/embedding-bg.svg") center / cover fixed no-repeat;
  background-color: #fff;
}
.page__footer { background: transparent; }

/* Draft status stays secondary to the paper title. */
.paper-status {
  display: inline-block;
  color: #555;
  font-style: italic;
  font-size: 0.9rem;
}

/* Section headings use typographic hierarchy without decorative accents. */
.page__content h2 {
  color: var(--global-base-color);
  margin-bottom: 0.8rem;
}

/* Full-width layout — override Susy grid when sidebar is absent */
#main .page,
#main .archive,
.page--fullwidth {
  float: none !important;
  width: 100% !important;
  max-width: 840px;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: 1.5rem;
  padding-right: 1.5rem;
  -webkit-margin-before: 0;
}

.page--fullwidth {
  padding-top: 1.75rem;
  padding-bottom: 1rem;
}

/* Divider under the page title on inner pages */
.page-divider {
  margin: 0.25rem 0 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--global-border-color);
}

/* Responsive */
@media (max-width: 600px) {
  .profile-hero {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 1.75rem 1.5rem;
    gap: 1.5rem;
  }
  .profile-hero__photo img { width: 150px; height: 150px; }
  .profile-hero__links, .profile-hero__tags { justify-content: center; }
  .education-item { flex-direction: column; gap: 0.15rem; }
  #main .page, #main .archive, .page--fullwidth {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}
</style>

<!-- end custom head snippets -->
